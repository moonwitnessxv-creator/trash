services:
  postgres:
    image: postgres:16-alpine
    container_name: trash-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trash}
      POSTGRES_USER: ${POSTGRES_USER:-trash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trash}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trash} -d ${POSTGRES_DB:-trash}"]
      interval: 10s
      timeout: 5s
      retries: 10

  admin-api:
    image: node:20-alpine
    container_name: trash-admin-api
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @trash/admin-api dev"
    environment:
      NODE_ENV: development
      PORT: 3001
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://trash:trash@postgres:5432/trash}
      POSTGRES_SSL: ${POSTGRES_SSL:-false}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
    volumes:
      - ./:/workspace
    ports:
      - "${ADMIN_API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard-web:
    image: node:20-alpine
    container_name: trash-dashboard-web
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @trash/dashboard-web dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NODE_ENV: development
      ADMIN_API_URL: ${ADMIN_API_URL:-http://admin-api:3001}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-http://localhost:3001}
    volumes:
      - ./:/workspace
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - admin-api

volumes:
  postgres_data:
