services:
  admin-api:
    image: node:20-alpine
    container_name: trash-admin-api
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @trash/admin-api dev"
    environment:
      NODE_ENV: development
      PORT: 3001
      SUPABASE_URL: ${SUPABASE_URL:-http://localhost:54321}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-replace-me}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-replace-me}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-replace-me}
    volumes:
      - ./:/workspace
    ports:
      - "${ADMIN_API_PORT:-3001}:3001"

  dashboard-web:
    image: node:20-alpine
    container_name: trash-dashboard-web
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @trash/dashboard-web dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NODE_ENV: development
      ADMIN_API_URL: ${ADMIN_API_URL:-http://admin-api:3001}
      NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-http://localhost:3001}
    volumes:
      - ./:/workspace
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - admin-api
