services:
  postgres:
    image: postgres:16-alpine
    container_name: trash-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-54322}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  admin-api:
    image: node:20-alpine
    container_name: trash-admin-api
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @trash/admin-api dev"
    environment:
      NODE_ENV: development
      PORT: 3001
      SUPABASE_URL: ${SUPABASE_URL:-http://localhost:54321}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-replace-me}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-replace-me}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-replace-me}
    volumes:
      - ./:/workspace
    ports:
      - "${ADMIN_API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
